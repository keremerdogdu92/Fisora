      - fisora_documents:/opt/fisora/data/documents
      - fisora_protected:/opt/fisora/protected-corpus
      - fisora_exports:/opt/fisora/data/exports
      - fisora_backups:/opt/fisora/data/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    environment:
      FISORA_ENV: production
      FISORA_STORE_BACKEND: ${FISORA_STORE_BACKEND:-postgres}
      FISORA_ACCOUNTING_STORE_TARGET: ${FISORA_ACCOUNTING_STORE_TARGET:-compatibility}
