# File: .github/workflows/deploy-production.yml
# Summary: Manually deploys the exact main-branch Fisora commit to production through AWS OIDC and a restricted SSM document.

name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: fisora-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "467626281341"
  INSTANCE_ID: i-0be84499519fb8271
  DEPLOY_ROLE_ARN: arn:aws:iam::467626281341:role/FisoraGitHubDeployRole
  SSM_DOCUMENT: FisoraProductionDeploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: fisora-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Deploy exact commit through SSM
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --comment "Fisora production deploy ${GITHUB_SHA}" \
            --parameters "TargetSha=${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"
          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          if [ "$wait_status" -ne 0 ]; then
            echo "Production deploy failed." >&2
            exit "$wait_status"
          fi
