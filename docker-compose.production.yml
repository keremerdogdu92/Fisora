services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fisora}
      POSTGRES_USER: ${POSTGRES_USER:-fisora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - fisora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisora} -d ${POSTGRES_DB:-fisora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/backend/scripts/apply_migrations.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fisora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FISORA_ENV: production
      FISORA_STORE_BACKEND: ${FISORA_STORE_BACKEND:-postgres}
      FISORA_AUTH_MODE: ${FISORA_AUTH_MODE:-mock_header_required}
      FISORA_AUTH_HEADER: ${FISORA_AUTH_HEADER:-X-Fisora-User-Id}
      FISORA_AUTH_PASSWORD_BOOTSTRAP_ENABLED: ${FISORA_AUTH_PASSWORD_BOOTSTRAP_ENABLED:-false}
      FISORA_STORE_PATH: /opt/fisora/data/exports/phase0_store.json
      FISORA_DOCUMENT_STORAGE_PATH: /opt/fisora/data/documents
      FISORA_EXPORT_PATH: /opt/fisora/data/exports
      FISORA_BACKUP_PATH: /opt/fisora/data/backups
      FISORA_AI_PROVIDER: ${FISORA_AI_PROVIDER:-disabled}
      FISORA_AI_MODEL: ${FISORA_AI_MODEL:-}
      FISORA_AI_COMPARISON_MODEL: ${FISORA_AI_COMPARISON_MODEL:-}
      FISORA_AI_MONTHLY_CAP_USD: ${FISORA_AI_MONTHLY_CAP_USD:-10}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - fisora_documents:/opt/fisora/data/documents
      - fisora_exports:/opt/fisora/data/exports
      - fisora_backups:/opt/fisora/data/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      FISORA_ENV: production
      FISORA_STORE_BACKEND: ${FISORA_STORE_BACKEND:-postgres}
      FISORA_AUTH_MODE: ${FISORA_AUTH_MODE:-mock_header_required}
      FISORA_AUTH_HEADER: ${FISORA_AUTH_HEADER:-X-Fisora-User-Id}
      FISORA_AUTH_PASSWORD_BOOTSTRAP_ENABLED: ${FISORA_AUTH_PASSWORD_BOOTSTRAP_ENABLED:-false}
      FISORA_STORE_PATH: /opt/fisora/data/exports/phase0_store.json
      FISORA_DOCUMENT_STORAGE_PATH: /opt/fisora/data/documents
      FISORA_WORKER_RETENTION_INTERVAL_SECONDS: ${FISORA_WORKER_RETENTION_INTERVAL_SECONDS:-86400}
      FISORA_WORKER_PROCESSING_INTERVAL_SECONDS: ${FISORA_WORKER_PROCESSING_INTERVAL_SECONDS:-30}
      FISORA_AI_PROVIDER: ${FISORA_AI_PROVIDER:-disabled}
      FISORA_AI_MODEL: ${FISORA_AI_MODEL:-}
      FISORA_AI_COMPARISON_MODEL: ${FISORA_AI_COMPARISON_MODEL:-}
      FISORA_AI_MONTHLY_CAP_USD: ${FISORA_AI_MONTHLY_CAP_USD:-10}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - fisora_documents:/opt/fisora/data/documents
      - fisora_exports:/opt/fisora/data/exports
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_FISORA_API_BASE_URL: ${NEXT_PUBLIC_FISORA_API_BASE_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${FISORA_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true

  backup:
    image: postgres:16-alpine
    command: ["/bin/sh", "/usr/local/bin/fisora-backup.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
      FISORA_DOCUMENT_STORAGE_PATH: /opt/fisora/data/documents
      FISORA_BACKUP_DIR: /opt/fisora/data/backups
      FISORA_BACKUP_INTERVAL_SECONDS: ${FISORA_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/fisora-backup.sh:ro
      - fisora_documents:/opt/fisora/data/documents:ro
      - fisora_backups:/opt/fisora/data/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fisora_postgres:
  fisora_redis:
  fisora_documents:
  fisora_exports:
  fisora_backups:
