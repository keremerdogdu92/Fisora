# File: .github/workflows/deploy-production.yml
# Summary: Automatically deploys explicitly release-marked main-branch commits to production through AWS OIDC and a restricted exact-SHA SSM document.

name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: fisora-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "467626281341"
  INSTANCE_ID: i-0be84499519fb8271
  DEPLOY_ROLE_ARN: arn:aws:iam::467626281341:role/FisoraGitHubDeployRole
  SSM_DOCUMENT: FisoraProductionDeploy

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify target is latest main
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_ref="$(curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main")"
          latest_sha="$(printf '%s' "$latest_ref" | python -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])')"

          echo "Requested SHA: ${GITHUB_SHA}"
          echo "Latest main SHA: ${latest_sha}"
          if [ "${GITHUB_SHA}" != "${latest_sha}" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale production deploy because a newer main commit exists."
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.release_gate.outputs.should_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: fisora-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Deploy exact commit through SSM
        if: steps.release_gate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --comment "Fisora production deploy ${GITHUB_SHA}" \
            --parameters "TargetSha=${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"
          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          echo "SSM command plugin details:"
          aws ssm list-command-invocations \
            --command-id "$command_id" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[].{Name:Name,Status:Status,ResponseCode:ResponseCode,Output:Output}' \
            --output json || true

          if [ "$wait_status" -ne 0 ]; then
            echo "Production deploy failed." >&2
            exit "$wait_status"
          fi
