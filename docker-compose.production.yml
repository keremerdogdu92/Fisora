  qnb-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.qnb_worker"]
    environment:
      FISORA_ENV: production
      FISORA_STORE_BACKEND: ${FISORA_STORE_BACKEND:-postgres}
      FISORA_ACCOUNTING_STORE_TARGET: ${FISORA_ACCOUNTING_STORE_TARGET:-compatibility}
      FISORA_STORE_PATH: /opt/fisora/data/exports/phase0_store.json
      FISORA_DOCUMENT_STORAGE_PATH: /opt/fisora/data/documents
      FISORA_QNB_SCHEDULER_ENABLED: ${FISORA_QNB_SCHEDULER_ENABLED:-false}
      FISORA_QNB_SCHEDULER_INTERVAL_SECONDS: ${FISORA_QNB_SCHEDULER_INTERVAL_SECONDS:-30}
      FISORA_QNB_ADAPTER: ${FISORA_QNB_ADAPTER:-fake}
      FISORA_QNB_ERP_CODE: ${FISORA_QNB_ERP_CODE:-FSR31422}
      FISORA_QNB_CREDENTIAL_KEY: ${FISORA_QNB_CREDENTIAL_KEY:-}
      FISORA_QNB_OPERATION_OWNER: ${FISORA_QNB_OPERATION_OWNER:-}
      FISORA_REAL_DATA_ACCESS_MODE: ${FISORA_REAL_DATA_ACCESS_MODE:-disabled}
      FISORA_REAL_DATA_PILOT_ENABLED: ${FISORA_REAL_DATA_PILOT_ENABLED:-false}
      FISORA_AUTHORITATIVE_ACCOUNTING_ENABLED: ${FISORA_AUTHORITATIVE_ACCOUNTING_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
    volumes:
      - fisora_documents:/opt/fisora/data/documents
      - fisora_exports:/opt/fisora/data/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/fisora-qnb-scheduler-heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_FISORA_API_BASE_URL: ${NEXT_PUBLIC_FISORA_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FISORA_HTTP_PORT:-80}:80"
      - "${FISORA_HTTPS_PORT:-443}:443"
    volumes:
      - ${FISORA_NGINX_CONFIG:-./deploy/nginx/default.tls.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${FISORA_TLS_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true

  backup:
    profiles: ["backup"]
    image: fisero-backup
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/bin/fisora-backup.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
      FISORA_DOCUMENT_STORAGE_PATH: /opt/fisora/data/documents
      FISORA_PROTECTED_CORPUS_PATH: /opt/fisora/protected-corpus
      FISORA_BACKUP_DIR: /opt/fisora/data/backups
      FISORA_BACKUP_MODE: ${FISORA_BACKUP_MODE:-disabled}
      FISORA_BACKUP_INTERVAL_SECONDS: ${FISORA_BACKUP_INTERVAL_SECONDS:-86400}
      FISORA_BACKUP_KEEP_DAYS: ${FISORA_BACKUP_KEEP_DAYS:-14}
      FISORA_BACKUP_OFFHOST_KEEP_DAYS: ${FISORA_BACKUP_OFFHOST_KEEP_DAYS:-30}
      FISORA_BACKUP_COPY_DIR: /mnt/fisora-backups
      FISORA_BACKUP_AGE_RECIPIENT: ${FISORA_BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/fisora-backup.sh:ro
      - fisora_documents:/opt/fisora/data/documents:ro
      - fisora_protected:/opt/fisora/protected-corpus:ro
      - fisora_backups:/opt/fisora/data/backups
      - ${FISORA_BACKUP_COPY_DIR:-./backups/offhost}:/mnt/fisora-backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fisora_postgres:
  fisora_redis:
  fisora_documents:
  fisora_protected:
  fisora_exports:
  fisora_backups:
