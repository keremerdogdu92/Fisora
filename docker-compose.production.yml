services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fisora}
      POSTGRES_USER: ${POSTGRES_USER:-fisora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - fisora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisora} -d ${POSTGRES_DB:-fisora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/app/backend/scripts/apply_migrations.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fisora}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fisora}
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fisora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      FISORA_ENV: production
      FISORA_STORE_BACKEND: ${FISORA_STORE_BACKEND:-postgres}
      FISORA_ACCOUNTING_STORE_TARGET: ${FISORA_ACCOUNTING_STORE_TARGET:-compatibility}
      FISORA_AUTH_MODE: ${FISORA_AUTH_MODE:-session_required}
      FISORA_AUTH_HEADER: ${FISORA_AUTH_HEADER:-X-Fisora-User-Id}
      FISORA_AUTH_PASSWORD_BOOTSTRAP_ENABLED: ${FISORA_AUTH_PASSWORD_BOOTSTRAP_ENABLED:-false}
      FISORA_SESSION_COOKIE_SECURE: ${FISORA_SESSION_COOKIE_SECURE:-true}
      FISORA_SESSION_COOKIE_SAMESITE: ${FISORA_SESSION_COOKIE_SAMESITE:-lax}
      FISORA_CORS_ALLOW_ORIGINS: ${FISORA_CORS_ALLOW_ORIGINS:-}
      FISORA_RATE_LIMIT_ENABLED: ${FISORA_RATE_LIMIT_ENABLED:-true}
      FISORA_RATE_LIMIT_WINDOW_SECONDS: ${FISORA_RATE_LIMIT_WINDOW_SECONDS:-60}
      FISORA_RATE_LIMIT_AI_MAX_REQUESTS: ${FISORA_RATE_LIMIT_AI_MAX_REQUESTS:-120}
      FISORA_RATE_LIMIT_EXPORT_MAX_REQUESTS: ${FISORA_RATE_LIMIT_EXPORT_MAX_REQUESTS:-60}
      FISORA_RATE_LIMIT_AUTH_MAX_REQUESTS: ${FISORA_RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      FISORA_PORTAL_BASE_URL: ${FISORA_PORTAL_BASE_URL:-}
      FISORA_EMAIL_PROVIDER: ${FISORA_EMAIL_PROVIDER:-disabled}
      FISORA_EMAIL_FROM: ${FISORA_EMAIL_FROM:-}
      FISORA_RESEND_API_KEY: ${FISORA_RESEND_API_KEY:-}
      FISORA_BREVO_API_KEY: ${FISORA_BREVO_API_KEY:-}
      FISORA_BREVO_SENDER_EMAIL: ${FISORA_BREVO_SENDER_EMAIL:-}
      FISORA_BREVO_SENDER_NAME: ${FISORA_BREVO_SENDER_NAME:-Fisora}
      FISORA_SMTP_HOST: ${FISORA_SMTP_HOST:-}
      FISORA_SMTP_PORT: ${FISORA_SMTP_PORT:-587}
      FISORA_SMTP_USERNAME: ${FISORA_SMTP_USERNAME:-}
      FISORA_SMTP_PASSWORD: ${FISORA_SMTP_PASSWORD:-}
