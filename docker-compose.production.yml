      FISORA_GEMINI_TIMEOUT_SECONDS: ${FISORA_GEMINI_TIMEOUT_SECONDS:-60}
      FISORA_GEMINI_MAX_OUTPUT_TOKENS: ${FISORA_GEMINI_MAX_OUTPUT_TOKENS:-16384}
      FISORA_GEMINI_MAX_INLINE_PDF_BYTES: ${FISORA_GEMINI_MAX_INLINE_PDF_BYTES:-50000000}
      FISORA_GEMINI_REQUESTS_PER_MINUTE: ${FISORA_GEMINI_REQUESTS_PER_MINUTE:-15}
